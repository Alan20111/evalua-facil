name: Deploy Cloud Functions

on:
  # Disparador manual: permite redesplegar sin tener que tocar un archivo
  # solo para provocar el push (y verificar el workflow tras cambiarlo).
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'scripts/sync-functions-shared.mjs'
      - 'src/utils/**'

jobs:
  deploy:
    name: firebase deploy --only functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
      # Pin al MAJOR, no a un parche: la 11.13.0 que estaba aquí solo conoce
      # runtimes hasta Node 16 y rechazaba el deploy con "engines field which
      # is unsupported" (functions/package.json declara Node 20). La 15 es la
      # misma línea que genera los tokens de `firebase login:ci` hoy.
        run: npm install -g firebase-tools@15

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy (predeploy hook runs sync-functions-shared.mjs automatically)
        run: firebase deploy --only functions --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
