name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'scripts/sync-functions-shared.mjs'
      - 'src/utils/**'

jobs:
  deploy:
    name: firebase deploy --only functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@11.13.0

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy (predeploy hook runs sync-functions-shared.mjs automatically)
        run: firebase deploy --only functions --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
