name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'

jobs:
  deploy:
    name: firebase deploy --only firestore:rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
      # Pin al MAJOR, no a un parche: la 11.13.0 que estaba aquí solo conoce
      # runtimes hasta Node 16 y rechazaba el deploy con "engines field which
      # is unsupported" (functions/package.json declara Node 20). La 15 es la
      # misma línea que genera los tokens de `firebase login:ci` hoy.
        run: npm install -g firebase-tools@15

      # Firebase validates rules server-side before applying — if there is
      # a syntax error, this step fails and the existing rules stay live.
      - name: Validate & Deploy
        run: firebase deploy --only firestore:rules --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
