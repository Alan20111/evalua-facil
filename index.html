<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin maximum-scale/user-scalable=no: bloqueaban el pinch-zoom y violaban
         WCAG 1.4.4 (Resize Text). Ver docs/PLAN_ACCESIBILIDAD_Y_ADAPTABILIDAD.md B1. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Evalúa Fácil</title>
    <meta name="description" content="Califica, organiza y evalúa a tus alumnos de bachillerato sin complicaciones: actividades, rúbricas, asistencia y calificaciones en un solo lugar." />
    <meta name="theme-color" content="#2563eb" />


    <!-- Favicon — el mismo icono (hojita) que la app de Android/iOS -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- iOS / Safari — icono que toma la PWA al agregarse a la pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evalúa Fácil" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- Android Chrome splash -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Pantalla inicial (rendimiento, oct-2026): se pinta en cuanto llega el
         HTML, sin esperar el JS (~200 KB con Firebase), y React la reemplaza al
         montar (createRoot vacía #root). Mismo fondo que la app (--surface) y el
         logo de 520 px, que ya es el que usa la portada. Todo en línea: aquí aún
         no hay CSS de la app. -->
    <link rel="preload" as="image" href="/logo-evalua-facil-520.webp" fetchpriority="high" />
    <style>
      html, body { margin: 0; background: #e6f1fb; }
      .pantalla-inicial { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
      .pantalla-inicial img { width: 224px; height: auto; animation: pantalla-inicial 1.2s ease-in-out infinite alternate; }
      @keyframes pantalla-inicial { from { opacity: 1; } to { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { .pantalla-inicial img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="pantalla-inicial" role="status" aria-label="Cargando Evalúa Fácil"><img src="/logo-evalua-facil-520.webp" alt="Evalúa Fácil" width="520" height="117" fetchpriority="high" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
