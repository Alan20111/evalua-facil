    <!-- Pantalla inicial (rendimiento, oct-2026): se pinta en cuanto llega el

         logo de 520 px, que ya es el que usa la portada. Todo en línea: aquí aún
         no hay CSS de la app. El logo va INCRUSTADO (data URI, ~20 KB): como
         petición aparte quedaba en cola detrás del JS y a veces no se pintaba
